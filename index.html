<head>

<meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">

<!--
  ============================================================
  EDIT YOUR PAGE HERE
  - name, bio: your profile text ("\n" starts a new line)
  - photo: the image file next to this page (or "" for initials)
  - skin: "moss", "ink", "clay" or "plum"     shape: "soft", "pill" or "square"
  - links: one { } per button, top to bottom. "featured": true fills it with color.
    Keep each "id" the same when you rename a button, so its click count carries on.
  - goatcounter: your GoatCounter code (the part before .goatcounter.com), or "" for no stats
  ============================================================
-->
<script id="profile" type="application/json">
{
  "name": "Naresh Parameswaran",
  "bio": "🔨 Building @madrascart_offl\n🧑‍💻 Freelance Performance Marketer\n💼 $65 Million in eComm Sales\n📈 Scaling D2C brands\n💎 Meta & Google Ads Expert",
  "photo": "avatar.jpg",
  "skin": "ink",
  "shape": "pill",
  "goatcounter": "",
  "links": [
    { "id": "madrascart", "label": "Madrascart", "url": "https://madrascart.com/", "featured": true },
    { "id": "waitlist", "label": "Join Madrascart NY2027 Box Waitlist", "url": "https://madrascart.com/products/join-the-waitlist?utm_source=instaDM&utm_medium=CommentDM&utm_campaign=Waitlist" },
    { "id": "instagram", "label": "Instagram", "url": "https://www.instagram.com/nareshparameswaran/" }
  ]
}
</script>

<style>
/* One narrow centered column: photo, name, bio, then full-width link buttons. */
:root{
  --bg:#f4f5f9;--surface:#ffffff;--fg:#141826;--muted:#5a6072;--line:#dcdfe8;--accent:#2a4fd6;--on-accent:#ffffff;--tint:#e1e7fb;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root{--bg:#0f1117;--surface:#171a23;--fg:#e6e9f2;--muted:#9aa1b5;--line:#272b38;--accent:#8aa4ff;--on-accent:#0b1230;--tint:#1a2036;color-scheme:dark}}

body.skin-moss{--bg:#f5f6f1;--surface:#ffffff;--fg:#1b1f1a;--muted:#5d665a;--line:#dde2d6;--accent:#3f6b3a;--on-accent:#ffffff;--tint:#e3ebdb}
body.skin-ink{--bg:#f4f5f9;--surface:#ffffff;--fg:#141826;--muted:#5a6072;--line:#dcdfe8;--accent:#2a4fd6;--on-accent:#ffffff;--tint:#e1e7fb}
body.skin-clay{--bg:#f8f4f1;--surface:#ffffff;--fg:#241914;--muted:#6c5a50;--line:#eaded6;--accent:#b4532a;--on-accent:#ffffff;--tint:#f5e2d7}
body.skin-plum{--bg:#f7f3f8;--surface:#ffffff;--fg:#22172a;--muted:#67596e;--line:#e6dceb;--accent:#7a3d8f;--on-accent:#ffffff;--tint:#eedff3}
@media (prefers-color-scheme: dark){
  body.skin-moss{--bg:#121511;--surface:#1a1e18;--fg:#e8ece4;--muted:#9aa595;--line:#2c3329;--accent:#8fc27f;--on-accent:#0f1a0c;--tint:#1f281b}
  body.skin-ink{--bg:#0f1117;--surface:#171a23;--fg:#e6e9f2;--muted:#9aa1b5;--line:#272b38;--accent:#8aa4ff;--on-accent:#0b1230;--tint:#1a2036}
  body.skin-clay{--bg:#17120f;--surface:#211915;--fg:#f1e7e1;--muted:#b09d92;--line:#352a24;--accent:#f0956c;--on-accent:#2a1206;--tint:#2b1c15}
  body.skin-plum{--bg:#151017;--surface:#1e1722;--fg:#efe6f3;--muted:#a998b0;--line:#31263a;--accent:#d29ae6;--on-accent:#2a0f36;--tint:#261b2c}
}
body.shape-soft{--radius:14px}
body.shape-pill{--radius:999px}
body.shape-square{--radius:3px}

*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(120% 60% at 50% -10%, var(--tint) 0%, transparent 60%);background-repeat:no-repeat}
.wrap{max-width:560px;margin:0 auto;padding-top:calc(56px + env(safe-area-inset-top, 0px));padding-bottom:calc(64px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:32px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.avatar{width:96px;height:96px;display:grid;place-items:center;overflow:hidden;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:36px;
  border-radius:min(var(--radius), 50%);box-shadow:0 0 0 6px var(--bg), 0 0 0 7px var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-family:var(--display);font-weight:800;font-size:clamp(32px, 8vw, 46px);line-height:1.02;letter-spacing:-.03em;margin:8px 0 0;text-wrap:balance;overflow-wrap:anywhere}
.bio{margin:0;color:var(--muted);font-size:16px;max-width:44ch;white-space:pre-line}
.links{display:flex;flex-direction:column;gap:12px}
.link{display:flex;align-items:center;gap:14px;padding:15px 22px;min-height:64px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;border-radius:var(--radius);
  transition:transform .18s ease, border-color .18s ease}
.link:hover{border-color:var(--accent);transform:translateX(3px)}
.link:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lbl{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.host{font-family:var(--mono);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{width:18px;height:18px;flex:none;color:var(--muted);transition:transform .18s ease}
.link:hover .go{transform:translate(2px,-2px);color:var(--accent)}
.link.featured{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.link.featured .host,.link.featured .go,.link.featured:hover .go{color:var(--on-accent);opacity:.85}
.foot{text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.link,.go{transition:none}.link:hover{transform:none}}
</style>
</head>
<body class="skin-ink shape-pill">
<main class="wrap" id="app">
  <header class="hero">
    <div class="avatar"><img src="avatar.jpg" alt=""></div>
    <h1>Naresh Parameswaran</h1>
  </header>
</main>
<noscript><p style="text-align:center">Turn on JavaScript to see the links.</p></noscript>

<script>
(function(){
  var p=JSON.parse(document.getElementById('profile').textContent);
  var ARROW='<svg class="go" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M6 14L14 6M7.5 6H14v6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function okUrl(u){return /^https?:\/\/[^\s]+\.[^\s]+/i.test(u||'')}
  function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}}
  function initials(n){var w=String(n||'').trim().split(/\s+/).filter(Boolean);return ((w[0]||'?')[0]+(w.length>1?w[w.length-1][0]:'')).toUpperCase()}

  document.body.className='skin-'+(p.skin||'ink')+' shape-'+(p.shape||'soft');
  document.title=p.name||'Links';
  var links=(p.links||[]).filter(function(l){return !l.hidden&&okUrl(l.url)});
  var face=p.photo?'<img src="'+esc(p.photo)+'" alt="">':esc(initials(p.name));
  var html='<header class="hero"><div class="avatar">'+face+'</div><h1>'+esc(p.name)+'</h1>'+(p.bio?'<p class="bio">'+esc(p.bio)+'</p>':'')+'</header><nav class="links" aria-label="Links">';
  links.forEach(function(l){
    html+='<a class="link'+(l.featured?' featured':'')+'" href="'+esc(l.url)+'" target="_blank" rel="noopener" data-id="'+esc(l.id)+'" data-label="'+esc(l.label)+'"><span class="t"><span class="lbl">'+esc(l.label||host(l.url))+'</span><span class="host">'+esc(host(l.url))+'</span></span>'+ARROW+'</a>';
  });
  html+='</nav>';
  document.getElementById('app').innerHTML=html;

  // Stats: GoatCounter counts the page view on its own; each button click is counted as an event.
  if(p.goatcounter&&/^[a-z0-9-]+$/i.test(p.goatcounter)){
    var s=document.createElement('script');
    s.async=true; s.src='https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter','https://'+p.goatcounter+'.goatcounter.com/count');
    document.head.appendChild(s);
    function onClick(e){
      var a=e.target.closest&&e.target.closest('a.link'); if(!a) return;
      if(e.type==='auxclick'&&e.button!==1) return;
      if(window.goatcounter&&window.goatcounter.count) window.goatcounter.count({path:'click/'+a.getAttribute('data-id'),title:a.getAttribute('data-label'),event:true});
    }
    document.addEventListener('click',onClick);
    document.addEventListener('auxclick',onClick);
  }
})();
</script>
</body>
</html>
